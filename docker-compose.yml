services:
  chroma:
    image: chromadb/chroma:latest
    ports: ["8001:8000"]
    volumes: ["chroma_data:/chroma/chroma"]
    environment: { IS_PERSISTENT: "TRUE" }
  ai-service:
    build: ./ai-service
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [chroma]
    environment: { CHROMA_HOST: chroma, CHROMA_PORT: "8000" }
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment: { AI_SERVICE_URL: http://ai-service:8000 }
    depends_on: [ai-service]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8080 }
    depends_on: [backend]
volumes:
  chroma_data:
